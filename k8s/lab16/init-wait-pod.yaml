apiVersion: v1
kind: Service
metadata:
  name: depends-on-me
  labels:
    app: depends-on-me
    lab: "16"
spec:
  type: ClusterIP
  selector:
    app: depends-on-me
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: depends-on-me
  labels:
    app: depends-on-me
    lab: "16"
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: init-wait-demo
  labels:
    app: init-wait-demo
    lab: "16"
spec:
  restartPolicy: Never
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          echo "[wait-for-service] resolving depends-on-me ..."
          attempt=0
          until nslookup depends-on-me >/dev/null 2>&1; do
            attempt=$((attempt+1))
            echo "  attempt $attempt: not ready yet, sleeping 2s"
            sleep 2
            if [ "$attempt" -ge 60 ]; then
              echo "[wait-for-service] giving up after 60 attempts"
              exit 1
            fi
          done
          echo "[wait-for-service] depends-on-me is reachable"
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "[main] dependency satisfied — starting work"
          sleep 3600
