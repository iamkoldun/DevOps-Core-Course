apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-info-service-rollout.fullname" . }}
  labels:
    {{- include "devops-info-service-rollout.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devops-info-service-rollout.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- if eq .Values.strategy.type "blueGreen" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-info-service-rollout.fullname" . }}-preview
  labels:
    {{- include "devops-info-service-rollout.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devops-info-service-rollout.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}
