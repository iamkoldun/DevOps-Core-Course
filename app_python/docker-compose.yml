services:
  devops-info-service:
    build: .
    image: iamkoldun/devops-info-service:latest
    container_name: devops-info-service
    ports:
      - "5000:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      DATA_DIR: "/data"
      CONFIG_PATH: "/config/config.json"
      APP_ENV: "local"
      LOG_LEVEL: "INFO"
    volumes:
      - ./data:/data
      - ./config:/config:ro
    restart: unless-stopped
