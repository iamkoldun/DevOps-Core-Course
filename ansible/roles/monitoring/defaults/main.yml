---
loki_version: "3.0.0"
promtail_version: "3.0.0"
grafana_version: "11.4.0"

loki_port: 3100
promtail_port: 9080
grafana_port: 3000

loki_retention_period: "168h"
loki_schema_version: "v13"
loki_schema_from: "2024-01-01"

monitoring_base_dir: "/home/{{ ansible_user }}/monitoring"

grafana_admin_user: "admin"
grafana_admin_password: "admin123"

app_python_image: "{{ dockerhub_username }}/devops-info-service"
app_python_tag: "latest"
app_python_port: 8000
app_python_container_port: 5000

app_go_image: "{{ dockerhub_username }}/devops-info-service-go"
app_go_tag: "latest"
app_go_port: 8001
app_go_container_port: 8080

loki_memory_limit: "1G"
loki_cpu_limit: "1.0"
loki_memory_reservation: "256M"
loki_cpu_reservation: "0.25"

promtail_memory_limit: "256M"
promtail_cpu_limit: "0.5"
promtail_memory_reservation: "64M"
promtail_cpu_reservation: "0.1"

grafana_memory_limit: "512M"
grafana_cpu_limit: "1.0"
grafana_memory_reservation: "128M"
grafana_cpu_reservation: "0.25"

app_memory_limit: "256M"
app_cpu_limit: "0.5"
app_memory_reservation: "64M"
app_cpu_reservation: "0.1"
