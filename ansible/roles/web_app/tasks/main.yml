---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  block:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
        recreate: auto

  rescue:
    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Deployment of {{ app_name }} failed. Check docker logs for details."

    - name: Show Docker Compose status on failure
      ansible.builtin.command:
        cmd: "docker compose -f {{ compose_project_dir }}/docker-compose.yml ps"
      register: compose_status
      ignore_errors: true

    - name: Display compose status
      ansible.builtin.debug:
        var: compose_status.stdout_lines

  tags:
    - app_deploy
    - compose
