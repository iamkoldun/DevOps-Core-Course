---
- name: Package installation
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Retry apt cache update with fix-missing on failure
      ansible.builtin.apt:
        update_cache: true
        fix_broken: true

    - name: Retry common package installation after cache fix
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  always:
    - name: Log package installation block completion
      ansible.builtin.copy:
        content: "common role packages block completed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/ansible-common-packages.log
        mode: "0644"

  become: true
  tags:
    - packages
    - common

- name: System configuration
  block:
    - name: Configure timezone
      community.general.timezone:
        name: "{{ common_timezone }}"

  become: true
  tags:
    - common

- name: User management
  block:
    - name: Ensure deploy user exists and has sudo access
      ansible.builtin.user:
        name: "{{ common_deploy_user }}"
        state: present
        groups: sudo
        append: true
        shell: /bin/bash

  always:
    - name: Log user management block completion
      ansible.builtin.copy:
        content: "common role users block completed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/ansible-common-users.log
        mode: "0644"

  become: true
  tags:
    - users
    - common
